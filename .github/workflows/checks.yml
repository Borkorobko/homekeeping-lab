name: Homekeeping Lab Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py

      - name: Validate content plan
        run: python scripts/validate_plan.py

      - name: Test static build
        run: python scripts/build_site.py

      - name: Build social preview and metadata
        run: python scripts/add_social_preview.py

      - name: Audit internal links and breadcrumbs
        run: python scripts/audit_links.py

      - name: Audit sitemap and indexability
        run: python scripts/audit_indexability.py

      - name: Audit performance and mobile basics
        run: python scripts/audit_performance.py
