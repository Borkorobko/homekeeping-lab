name: Generate Homekeeping Lab Guide

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1,3,5"

permissions:
  contents: write

concurrency:
  group: homekeeping-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Validate content plan
        run: python scripts/validate_plan.py

      - name: Generate one eligible draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/generate.py

      - name: Run quality gate
        run: python scripts/quality_gate.py

      - name: Run safety gate
        run: python scripts/safety_gate.py

      - name: Build static site
        run: python scripts/build_site.py

      - name: Build social preview and metadata
        run: python scripts/add_social_preview.py

      - name: Audit internal links and breadcrumbs
        run: python scripts/audit_links.py

      - name: Audit sitemap and indexability
        run: python scripts/audit_indexability.py

      - name: Validate plan after pipeline
        run: python scripts/validate_plan.py

      - name: Commit pipeline output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_plan.csv content qa site
          git commit -m "Generate and gate Homekeeping Lab guide" || echo "No changes to commit"
          git push
