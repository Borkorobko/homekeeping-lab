name: Rebuild Homekeeping Lab Site

on:
  push:
    paths:
      - "scripts/common.py"
      - "scripts/build_site.py"
      - "scripts/add_social_preview.py"
      - "scripts/audit_links.py"
      - "scripts/audit_indexability.py"
      - "config/site.json"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: homekeeping-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Build static site
        run: python scripts/build_site.py

      - name: Build social preview and metadata
        run: python scripts/add_social_preview.py

      - name: Audit internal links and breadcrumbs
        run: python scripts/audit_links.py

      - name: Audit sitemap and indexability
        run: python scripts/audit_indexability.py

      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site content_plan.csv
          git commit -m "Rebuild Homekeeping Lab site" || echo "No changes to commit"
          git push
